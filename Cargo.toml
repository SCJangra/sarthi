[workspace]
members = [
	"crates/derive",
	"crates/nvim-client",
	"crates/nvui",
	"crates/renderer",
]
resolver = "3"

[workspace.dependencies]
arrayvec = { version = "0.7", features = ["serde"] }
renderer = { package = "nvui-renderer", path = "crates/renderer" }
nvim = { package = "nvui-nvim-client", path = "crates/nvim-client" }
rmp = "0.8"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
dashmap = "6"
flume = "0.12"
arc-swap = "1"
serde_tuple = "1"
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
rustc-hash = "2"
bytemuck = { version = "1", features = ["derive"] }
# glyphon's cosmic-text, with the shaping cache: without it, laying out a full screen takes ~20× longer.
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
smol = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
