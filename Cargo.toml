[workspace]
members = [
	"crates/derive",
	"crates/editor",
	"crates/nvui",
	"crates/renderer",
	"crates/rpc",
]
resolver = "3"

[workspace.dependencies]
arrayvec = { version = "0.7", features = ["serde"] }
editor = { package = "nvui-editor", path = "crates/editor" }
renderer = { package = "nvui-renderer", path = "crates/renderer" }
rpc = { package = "nvui-rpc", path = "crates/rpc" }
rmp = "0.8"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
flume = "0.12"
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
rustc-hash = "2"
bytemuck = { version = "1", features = ["derive"] }
# Path rasterizer swash uses; draws the characters nvui shapes itself (box drawing, blocks, powerline)
zeno = "0.3"
# glyphon's cosmic-text, with the shaping cache: without it, laying out a full screen takes ~20× longer.
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
smol = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Clipboard access through the window's display: on Wayland it uses the window's connection, which works on every
# compositor
window_clipboard = "0.5"

[workspace.package]
version = "0.1.0"
edition = "2024"
